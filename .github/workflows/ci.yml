name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./backend/mvnw -f backend/pom.xml -B verify
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/target/site/kover
            backend/target/detekt
            backend/target/ktlint
            backend/target/surefire-reports
          if-no-files-found: ignore
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  deployment_checks:
    name: Deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash -n scripts/deploy.sh scripts/deploy-remote.sh
      - run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Validate production Compose
        env:
          TOGO_RELEASE_SHA: '0123456789012345678901234567890123456789'
          TOGO_POSTGRES_VOLUME: infra_postgres_data
          TELEGRAM_BOT_TOKEN: validation-placeholder
          TELEGRAM_WEBHOOK_SECRET: validation-placeholder
          DB_USER: togo
          DB_PASSWORD: validation-placeholder
        run: docker compose -f infra/docker-compose.prod.yml config --quiet
  images:
    name: Publish images
    needs: [backend, frontend, deployment_checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-docker.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  deploy:
    name: Deploy production
    needs: images
    uses: ./.github/workflows/deploy.yml
    with:
      revision: ${{ github.sha }}
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
