name: Build and publish Docker images

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  backend_image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: kolzuk/togo-backend:${{ github.sha }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: build
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -f ./backend/Dockerfile -t "$IMAGE" .
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: push image to docker Hub
        run: docker push "$IMAGE"
  frontend_image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: kolzuk/togo-frontend:${{ github.sha }}
      FRONTEND_MODE: ${{ vars.FRONTEND_MODE || 'demo' }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: build
        run: >-
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA"
          --build-arg "FRONTEND_MODE=$FRONTEND_MODE"
          -f ./frontend/Dockerfile -t "$IMAGE" ./frontend
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: push image to docker Hub
        run: docker push "$IMAGE"
