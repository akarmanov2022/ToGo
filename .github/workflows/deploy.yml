name: Deploy to VPS

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
    secrets:
      USER_IP:
        required: true
      USERNAME:
        required: true
      ROOT_PASSWORD:
        required: true
      DEPLOY_KNOWN_HOSTS:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      GRAFANA_USER:
        required: true
      GRAFANA_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      revision:
        description: Полный SHA ранее собранного коммита для повторного деплоя или отката
        type: string
        required: true

permissions:
  contents: read

# Деплой нельзя отменять посередине замены контейнеров.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOGO_RELEASE_SHA: ${{ inputs.revision }}
    steps:
      - name: Validate revision
        run: '[[ "$TOGO_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
      - name: Skip superseded automatic deployment
        id: revision
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            current=$(git ls-remote origin refs/heads/main | cut -f1)
            if [[ "$current" != "$TOGO_RELEASE_SHA" ]]; then
              echo 'В main уже есть более новый коммит; этот деплой пропущен.'
              echo 'deploy=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'deploy=true' >> "$GITHUB_OUTPUT"
      - name: Install SSH password helper
        if: steps.revision.outputs.deploy == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sshpass
      - name: Deploy release over SSH
        if: steps.revision.outputs.deploy == 'true'
        env:
          USER_IP: ${{ secrets.USER_IP }}
          USERNAME: ${{ secrets.USERNAME }}
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/ToGo' }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GRAFANA_USER: ${{ secrets.GRAFANA_USER }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        run: bash scripts/deploy-remote.sh
      - name: Check public HTTPS
        if: steps.revision.outputs.deploy == 'true'
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 15 https://dev-togo.ru/ -o /dev/null
