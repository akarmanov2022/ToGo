openapi: 3.0.3

info:
  title: ToGo Mini App API
  version: 1.0.0
  description: |
    Контракт Telegram Mini App для совместных событий.
    JSON использует camelCase, идентификаторы — UUID, даты — RFC 3339
    с обязательным часовым поясом. Сервер возвращает даты в UTC.
    Все операции, кроме входа через Telegram и webhook бота, требуют Bearer-токен.
    Неизвестные поля запросов отклоняются с 400 VALIDATION_ERROR.

    Организатор определяется из авторизации, автоматически становится участником
    и учитывается в minUsers, maxUsers и participantsCount. Создавать участие
    другого пользователя по его логину нельзя.

    Организатор задаёт registrationClosesAt: now < registrationClosesAt <= startsAt < endsAt.
    До этого срока набор открыт, даже если свободных мест временно нет.
    При now >= registrationClosesAt сервер атомарно фиксирует состав:
    если participantsCount < minUsers — cancelled_by_system, иначе registration_closed.
    Вступление и выход после срока запрещены независимо от задержки фонового задания.
    При now >= endsAt событие registration_closed переходит в finished;
    отменённые события сохраняют статус и состав участников.
    Изменения события, вступление, выход и закрытие набора сериализуются
    блокировкой события в транзакции, чтобы исключить переполнение и гонки.

tags:
  - name: Auth
    description: Вход через Telegram Mini App
  - name: Bot
    description: Служебные обновления Telegram-бота
  - name: Users
    description: Текущий пользователь
  - name: Categories
    description: Справочник категорий, управляемый бэкендом
  - name: Events
    description: События и участие
  - name: Comments
    description: Комментарии участников под событием

security:
  - bearerAuth: []

paths:
  /api/v1/bot/webhook:
    post:
      tags: [Bot]
      operationId: receiveBotUpdate
      summary: Принять обновление бота от Telegram
      description: |
        Telegram присылает обновление по HTTPS. Сервер сравнивает заголовок
        X-Telegram-Bot-Api-Secret-Token с TELEGRAM_WEBHOOK_SECRET и отвечает
        на команду /start в личном чате приветствием с кнопкой Mini App.
        Остальные обновления подтверждаются без действия.
      security: []
      parameters:
        - name: X-Telegram-Bot-Api-Secret-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: Обновление принято
        '403':
          description: Секрет webhook не совпадает (FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/UnexpectedError'

  /api/v1/auth/telegram:
    post:
      tags: [Auth]
      operationId: authenticateTelegram
      summary: Войти или зарегистрироваться через Telegram
      description: |
        Клиент передаёт исходную строку Telegram.WebApp.initData.
        Сервер проверяет её подпись по алгоритму Telegram и auth_date:
        данные не старше 5 минут, допустимое отклонение в будущее — 30 секунд.
        Объект user обязателен. initDataUnsafe не является основанием для входа.
        Пользователь создаётся или находится по проверенному Telegram user.id;
        tgLogin обновляется из user.username, а при его отсутствии становится null.
        Telegram ID и логин из отдельных полей тела не принимаются.
        Возвращается токен приложения сроком на 1 час. После истечения клиент
        повторяет вход со свежим initData (при необходимости переоткрывает Mini App).
        Токены и initData не должны попадать в логи.
      externalDocs:
        description: Проверка initData на сервере
        url: https://core.telegram.org/bots/webapps#validating-data-received-via-the-mini-app
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
      responses:
        '200':
          description: Вход выполнен; одинаковый ответ для нового и существующего пользователя
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверные, просроченные initData или отсутствие проверенного user (INVALID_TELEGRAM_INIT_DATA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/UnexpectedError'

  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Получить свой профиль
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/UnexpectedError'

    put:
      tags: [Users]
      operationId: updateCurrentUser
      summary: Изменить свой профиль
      description: |
        Полностью заменяет имя, город и категории профиля.
        Пустой массив categories очищает категории, отсутствие city или null удаляет город.
        Категория вне перечня EventCategory — 400 VALIDATION_ERROR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Профиль сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/UnexpectedError'

  /api/v1/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Users]
      operationId: getUser
      summary: Получить профиль другого пользователя
      description: Telegram ID не возвращается.
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Пользователь не найден (USER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/UnexpectedError'

  /api/v1/categories:
    get:
      tags: [Categories]
      operationId: getCategories
      summary: Получить доступные категории
      description: |
        Весь перечень EventCategory в порядке объявления: код и название на русском.
        Клиент выбирает коды из этого списка; создавать категории нельзя.
      responses:
        '200':
          description: Категории
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/UnexpectedError'

  /api/v1/events:
    get:
      tags: [Events]
      operationId: getEvents
      summary: Найти события
      description: |
        Фильтры объединяются через AND. По умолчанию возвращаются события всех
        состояний, включая прошедшие и отменённые. Порядок — startsAt ASC, id ASC.
        startsFrom включается, startsTo не включается; при обеих границах
        startsFrom должен быть меньше startsTo. Пустая выдача — 200 с items: [].
      parameters:
        - name: query
          in: query
          description: Подстрока названия без учёта регистра; крайние пробелы удаляются, пустая строка не фильтрует
          schema:
            type: string
        - name: category
          in: query
          description: События с указанной категорией; значение вне перечня даёт 400 VALIDATION_ERROR
          schema:
            $ref: '#/components/schemas/EventCategory'
        - name: startsFrom
          in: query
          description: Нижняя включительная граница времени начала
          schema:
            type: string
            format: date-time
        - name: startsTo
          in: query
          description: Верхняя исключительная граница времени начала
          schema:
            type: string
            format: date-time
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/EventState'
        - name: participating
          in: query
          description: При true — только события с моим участием (включая организованные мной); false не фильтрует
          schema:
            type: boolean
            default: false
        - name: hasFreePlaces
          in: query
          description: |
            При true — только события, к которым можно присоединиться: recruiting,
            now < registrationClosesAt и participantsCount < maxUsers; false не фильтрует
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница событий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [Events]
      operationId: createEvent
      summary: Создать событие
      description: |
        Сервер назначает UUID, организатора и состояние recruiting.
        Событие и участие организатора создаются в одной транзакции.
        Требуется now < registrationClosesAt <= startsAt < endsAt и 1 <= minUsers <= maxUsers.
        Категория вне перечня EventCategory — 400 VALIDATION_ERROR.
        Если организатор участвует в событии в recruiting или registration_closed,
        начало которого отстоит от startsAt меньше чем на 3 часа, — 409 SCHEDULE_CONFLICT.
        Операция не идемпотентна: повторный POST создаёт новое событие.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
            example:
              title: Вечер настолок
              description: Играем в настольные игры
              location: Кафе на Центральной улице, 10
              startsAt: '2026-12-20T18:00:00+03:00'
              endsAt: '2026-12-20T21:00:00+03:00'
              registrationClosesAt: '2026-12-20T15:00:00+03:00'
              minUsers: 3
              maxUsers: 6
              icon: '🎲'
              category: BOARD_GAMES
      responses:
        '201':
          description: Событие создано, организатор включён в участников
          headers:
            Location:
              description: Относительный адрес созданного события
              schema:
                type: string
                example: /api/v1/events/019a0000-0000-7000-8000-000000000002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/UnexpectedError'

  /api/v1/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      operationId: getEvent
      summary: Получить событие
      description: Состав участников доступен отдельно через GET /api/v1/events/{eventId}/participants.
      responses:
        '200':
          $ref: '#/components/responses/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
    patch:
      tags: [Events]
      operationId: updateEvent
      summary: Изменить событие организатором
      description: |
        Только организатор, только в recruiting и до текущего registrationClosesAt.
        Переданные поля заменяются, отсутствующие сохраняются. Пустой объект и null
        недопустимы. category заменяет категорию события. Пустая строка icon
        удаляет иконку (в ответе icon: null). Описание не может стать пустым.
        startsAt, endsAt, location, organizer и state менять нельзя.
        registrationClosesAt можно перенести, пока текущий срок ещё не истёк;
        новый срок должен удовлетворять now < registrationClosesAt <= startsAt.
        Ограничения minUsers/maxUsers проверяются для результата изменения;
        maxUsers нельзя уменьшить ниже participantsCount (409 CAPACITY_BELOW_PARTICIPANTS).
        Закрытый набор — 409 REGISTRATION_CLOSED, отменённое/прошедшее событие —
        409 INVALID_EVENT_STATE. Категория вне перечня — 400 VALIDATION_ERROR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          $ref: '#/components/responses/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/UnexpectedError'

  /api/v1/events/{eventId}/cancel:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Events]
      operationId: cancelEvent
      summary: Отменить событие организатором
      description: |
        Только организатор. До startsAt можно отменить recruiting или registration_closed.
        Состояние меняется на cancelled_by_organizer, событие и участники сохраняются.
        Повторная отмена уже cancelled_by_organizer возвращает 200 без изменений,
        в том числе после startsAt. Остальные состояния или начавшееся событие —
        409 INVALID_EVENT_STATE. Тело запроса не требуется.
      responses:
        '200':
          $ref: '#/components/responses/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/UnexpectedError'

  /api/v1/events/{eventId}/participants:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      operationId: getEventParticipants
      summary: Получить участников события
      description: Доступно авторизованным пользователям. Организатор включён; сортировка по id ASC.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница участников
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'

  /api/v1/events/{eventId}/participants/me:
    parameters:
      - $ref: '#/components/parameters/EventId'
    put:
      tags: [Events]
      operationId: joinEvent
      summary: Присоединиться к событию
      description: |
        Участник определяется по авторизации, тело запроса не требуется.
        Если пользователь уже участник, возвращается 200 без изменений независимо
        от состояния и заполненности события. Иначе нужны recruiting,
        now < registrationClosesAt и participantsCount < maxUsers.
        Сначала проверяется состояние, затем вместимость. Закрытый набор —
        409 REGISTRATION_CLOSED; отменённое/прошедшее событие — 409 INVALID_EVENT_STATE;
        отсутствие мест — 409 EVENT_FULL. Участие в событии в recruiting или
        registration_closed, начало которого отстоит меньше чем на 3 часа, —
        409 SCHEDULE_CONFLICT. Проверка и добавление атомарны.
      responses:
        '200':
          $ref: '#/components/responses/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags: [Events]
      operationId: leaveEvent
      summary: Выйти из события
      description: |
        Если пользователь не участник, возвращается 204 независимо от состояния.
        Организатору выход запрещён (409 ORGANIZER_CANNOT_LEAVE), он может отменить событие.
        Остальным участникам выход разрешён только в recruiting до registrationClosesAt.
        Закрытый набор — 409 REGISTRATION_CLOSED, отменённое/прошедшее событие —
        409 INVALID_EVENT_STATE. Снижение количества ниже minUsers до срока
        регистрации не отменяет событие. Проверка и удаление атомарны.
      responses:
        '204':
          description: Пользователь не участвует в событии; тело отсутствует
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/UnexpectedError'

  /api/v1/events/{eventId}/comments:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Comments]
      operationId: getEventComments
      summary: Получить комментарии к событию
      description: Доступно авторизованным пользователям. Порядок — createdAt ASC, id ASC.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница комментариев
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [Comments]
      operationId: createEventComment
      summary: Оставить комментарий
      description: |
        Только участник события, включая организатора, в любом состоянии события.
        Не участнику — 403 FORBIDDEN. Комментарии нельзя изменить или удалить.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Комментарий опубликован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен приложения из POST /api/v1/auth/telegram; заголовок Authorization со значением Bearer <accessToken>

  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: Размер страницы
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Число пропускаемых записей
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0

  responses:
    EventResponse:
      description: Актуальное событие с признаками участия текущего пользователя
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Event'
    BadRequest:
      description: Некорректный JSON, UUID, дата, значение перечня, параметры или бизнес-валидация (VALIDATION_ERROR)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: VALIDATION_ERROR
            message: Срок регистрации не может быть позже начала события
            details:
              - field: registrationClosesAt
                message: Должно быть не позже startsAt
    Unauthorized:
      description: Токен отсутствует, недействителен или истёк (UNAUTHORIZED)
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Пользователь не организатор события или не участник при комментировании (FORBIDDEN)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Событие не найдено (EVENT_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: |
        Конфликт с текущим состоянием события. Код зависит от операции:
        REGISTRATION_CLOSED, INVALID_EVENT_STATE, EVENT_FULL,
        CAPACITY_BELOW_PARTICIPANTS, ORGANIZER_CANNOT_LEAVE или SCHEDULE_CONFLICT.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: EVENT_FULL
            message: Все места заняты
            details: []
    UnexpectedError:
      description: Непредвиденная ошибка сервера (INTERNAL_ERROR); внутренние детали не раскрываются
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    TelegramAuthRequest:
      type: object
      additionalProperties: false
      required: [initData]
      properties:
        initData:
          type: string
          minLength: 1
          writeOnly: true
          description: Неизменённая строка Telegram.WebApp.initData

    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          minLength: 1
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          format: int32
          enum: [3600]
          description: Срок жизни токена в секундах с момента выдачи
        user:
          $ref: '#/components/schemas/CurrentUser'

    CurrentUser:
      type: object
      required: [id, tgId, tgLogin, name, photoUrl, city, categories, createdEventsCount, visitedEventsCount]
      properties:
        id:
          type: string
          format: uuid
        tgId:
          type: integer
          format: int64
          description: Telegram user.id из проверенных initData
        tgLogin:
          type: string
          nullable: true
          description: Telegram username без @; null, если username отсутствует
        name:
          type: string
          minLength: 1
          description: Имя профиля; при первом входе берётся из имени и фамилии Telegram
        photoUrl:
          type: string
          nullable: true
          description: Адрес фото из Telegram; null, если фото нет
        city:
          type: string
          nullable: true
        categories:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EventCategory'
        createdEventsCount:
          type: integer
          format: int32
          minimum: 0
          description: Число событий, организованных пользователем, в любом состоянии
        visitedEventsCount:
          type: integer
          format: int32
          minimum: 0
          description: Число событий в finished, в которых пользователь участвовал, включая организованные им

    UserProfile:
      type: object
      required: [id, tgLogin, name, photoUrl, city, categories, createdEventsCount, visitedEventsCount]
      description: Профиль другого пользователя без Telegram ID
      properties:
        id:
          type: string
          format: uuid
        tgLogin:
          type: string
          nullable: true
        name:
          type: string
          minLength: 1
        photoUrl:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        categories:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EventCategory'
        createdEventsCount:
          type: integer
          format: int32
          minimum: 0
          description: Число событий, организованных пользователем, в любом состоянии
        visitedEventsCount:
          type: integer
          format: int32
          minimum: 0
          description: Число событий в finished, в которых пользователь участвовал, включая организованные им

    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [name, categories]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '[\s\S]*\S[\s\S]*'
        city:
          type: string
          nullable: true
          minLength: 1
          maxLength: 100
          pattern: '[\s\S]*\S[\s\S]*'
        categories:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EventCategory'

    UserSummary:
      type: object
      required: [id, tgLogin]
      properties:
        id:
          type: string
          format: uuid
        tgLogin:
          type: string
          nullable: true
          description: Telegram username без @; может отсутствовать и изменяться

    EventCategory:
      type: string
      description: |
        Код категории из фиксированного перечня:
        PICNIC — «Пикник», RUN — «Пробежка», EXCURSION — «Поход на экскурсию»,
        BOARD_GAMES — «Настолки», QUEST — «Квест», CINEMA — «Кино», CAFE — «Кафе/Ресторан».
      enum:
        - PICNIC
        - RUN
        - EXCURSION
        - BOARD_GAMES
        - QUEST
        - CINEMA
        - CAFE

    Category:
      type: object
      required: [code, name]
      properties:
        code:
          $ref: '#/components/schemas/EventCategory'
        name:
          type: string
          description: Название категории на русском
          example: Настолки

    EventState:
      type: string
      description: |
        recruiting — набор открыт до registrationClosesAt;
        cancelled_by_organizer — отменено организатором;
        cancelled_by_system — к сроку регистрации не набран минимум;
        registration_closed — состав зафиксирован, событие ожидается или идёт;
        finished — событие завершилось. Заполнение всех мест само по себе
        не меняет recruiting, освободившееся место можно занять до срока регистрации.
      enum:
        - recruiting
        - cancelled_by_organizer
        - cancelled_by_system
        - registration_closed
        - finished

    Event:
      type: object
      required:
        - id
        - title
        - description
        - location
        - startsAt
        - endsAt
        - registrationClosesAt
        - state
        - icon
        - latitude
        - longitude
        - minUsers
        - maxUsers
        - organizer
        - category
        - participantsCount
        - availableSlots
        - isParticipant
        - isOrganizer
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        description:
          type: string
        location:
          type: string
          minLength: 1
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        registrationClosesAt:
          type: string
          format: date-time
          description: Заданный организатором срок закрытия регистрации и проверки минимума участников
        state:
          $ref: '#/components/schemas/EventState'
        icon:
          type: string
          nullable: true
          description: Текстовая иконка (например, emoji); null, если не задана
        latitude:
          type: number
          format: double
          nullable: true
          description: Широта точки на карте; null вместе с longitude, если точки нет
        longitude:
          type: number
          format: double
          nullable: true
          description: Долгота точки на карте; null вместе с latitude, если точки нет
        minUsers:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
        maxUsers:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
        organizer:
          $ref: '#/components/schemas/UserSummary'
        category:
          $ref: '#/components/schemas/EventCategory'
        participantsCount:
          type: integer
          format: int32
          minimum: 1
          description: Количество участников, включая организатора
        availableSlots:
          type: integer
          format: int32
          minimum: 0
          description: maxUsers минус participantsCount; положительное значение не означает, что набор открыт
        isParticipant:
          type: boolean
          description: Текущий пользователь входит в состав участников
        isOrganizer:
          type: boolean
          description: Текущий пользователь — организатор

    CreateEventRequest:
      type: object
      additionalProperties: false
      required: [title, description, location, startsAt, endsAt, registrationClosesAt, minUsers, maxUsers, category]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '[\s\S]*\S[\s\S]*'
          description: Название, содержащее хотя бы один непробельный символ
        description:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '[\s\S]*\S[\s\S]*'
          description: Описание, содержащее хотя бы один непробельный символ
        location:
          type: string
          minLength: 1
          pattern: '[\s\S]*\S[\s\S]*'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        registrationClosesAt:
          type: string
          format: date-time
          description: now < registrationClosesAt <= startsAt; задаётся организатором
        icon:
          type: string
          description: Текстовая иконка; отсутствие или пустая строка означает отсутствие иконки
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Передаётся вместе с longitude или не передаётся вовсе
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Передаётся вместе с latitude или не передаётся вовсе
        minUsers:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
        maxUsers:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          description: Не меньше minUsers; организатор занимает одно место
        category:
          $ref: '#/components/schemas/EventCategory'

    UpdateEventRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Частичное изменение. Отсутствующие поля сохраняются, null запрещён.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '[\s\S]*\S[\s\S]*'
        description:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '[\s\S]*\S[\s\S]*'
        registrationClosesAt:
          type: string
          format: date-time
        icon:
          type: string
          description: Пустая строка удаляет иконку
        minUsers:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
        maxUsers:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
        category:
          $ref: '#/components/schemas/EventCategory'

    EventPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        total:
          type: integer
          format: int64
          minimum: 0
          description: Общее число событий после фильтрации, до пагинации
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        offset:
          type: integer
          format: int32
          minimum: 0

    ParticipantPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        total:
          type: integer
          format: int64
          minimum: 0
          description: Общее число участников, включая организатора
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        offset:
          type: integer
          format: int32
          minimum: 0

    Comment:
      type: object
      required: [id, author, text, createdAt]
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/UserSummary'
        text:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateCommentRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '[\s\S]*\S[\s\S]*'

    CommentPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        total:
          type: integer
          format: int64
          minimum: 0
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        offset:
          type: integer
          format: int32
          minimum: 0

    ApiError:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          description: Стабильный машинный код для обработки на клиенте
          enum:
            - VALIDATION_ERROR
            - INVALID_TELEGRAM_INIT_DATA
            - UNAUTHORIZED
            - FORBIDDEN
            - EVENT_NOT_FOUND
            - USER_NOT_FOUND
            - REGISTRATION_CLOSED
            - INVALID_EVENT_STATE
            - EVENT_FULL
            - CAPACITY_BELOW_PARTICIPANTS
            - ORGANIZER_CANNOT_LEAVE
            - SCHEDULE_CONFLICT
            - INTERNAL_ERROR
        message:
          type: string
          description: Сообщение для пользователя; не использовать для определения типа ошибки
        details:
          type: array
          description: Ошибки отдельных полей; пустой массив для ошибок без привязки к полю
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Имя поля JSON или параметра запроса, например categories[0]
        message:
          type: string
