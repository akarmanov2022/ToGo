server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name dev-togo.ru;
  server_tokens off;
  ssl_certificate /etc/letsencrypt/live/dev-togo.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dev-togo.ru/privkey.pem;

  # Docker DNS обновляет адреса после пересоздания сервисов.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8080;
  set $frontend http://frontend:80;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_pass $backend;
  }

  location /swagger-ui/ {
    proxy_pass $backend;
  }

  location /v3/api-docs {
    proxy_pass $backend;
  }

  location /actuator {
    return 404;
  }

  location / {
    proxy_pass $frontend;
  }

  location = /actuator/health {
          proxy_pass http://backend:8080/actuator/health;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /actuator/ {
          return 404;
      }
}

server {
  listen 80;
  listen [::]:80;
  server_name dev-togo.ru;

  return 301 https://dev-togo.ru$request_uri;
}
